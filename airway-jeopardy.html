<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Zero third-party requests by design; the CSP makes that an enforced invariant. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Airway Rounds · Clinical Quiz | skflx.MD</title>
  <meta name="description" content="Team-based ENT/Head &amp; Neck airway quiz — Rounds, Jeopardy Board, Quick Quiz, and Browse modes for nursing education, with topic/difficulty filters, steal mechanics, and session history.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/site.css">

  <style>
    html, body { margin: 0; padding: 0; }
    #aw-app { min-height: calc(100vh - 53px); }

    /* ─── Scope: the game area stays dark in both site themes ─── */
    /* Stage palette = the site's night tokens (css/site.css), fixed dark in
       both themes because this runs on projectors. */
    .aw {
      --aw-bg: #0D0E10; --aw-surface: #16181B; --aw-border: #2C2F35; --aw-border-strong: #3A3E45;
      --aw-faint: #7E838C; --aw-muted: #A6AAB2; --aw-text: #ECEBE6; --aw-strong: #FFFFFF;
      --aw-accent: #FF6B42; --aw-accent-line: #9E3F24; --aw-accent-soft: rgba(255, 107, 66, 0.12);
      background: var(--aw-bg);
      color: var(--aw-text);
      font-family: var(--font-sans);
      min-height: calc(100vh - 53px);
      box-sizing: border-box;
    }
    .aw *, .aw *::before, .aw *::after { box-sizing: border-box; }
    .aw select option { background: var(--aw-surface); color: var(--aw-text); }
    .aw button { font-family: inherit; }

    .aw-wrap { max-width: 640px; margin: 0 auto; padding: 1.75rem 1rem 3rem; }
    .aw-wrap--wide { max-width: 880px; }

    .aw-eyebrow { display: block; margin-bottom: 0.75rem; }
    .aw-eyebrow span { font-family: var(--font-mono); color: var(--aw-accent); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
    .aw-hero { text-align: center; margin-bottom: 1.75rem; }
    .aw-h1 { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 740; font-stretch: 118%; letter-spacing: -0.035em; line-height: 1; color: var(--aw-strong); margin: 0 0 0.25rem; }
    .aw-sub { color: var(--aw-muted); font-size: 0.85rem; margin: 0; }

    .aw-section { margin-bottom: 1.5rem; }
    .aw-label {
      font-size: 0.68rem; font-weight: 700; color: var(--aw-faint);
      letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 0.55rem;
    }

    /* Mode picker */
    .aw-mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .aw-mode-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 0.3rem;
      background: var(--aw-surface); border: 1px solid var(--aw-border); border-radius: 6px;
      padding: 0.9rem 0.85rem; text-align: left; cursor: pointer; color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .aw-mode-card:hover { border-color: var(--aw-border-strong); }
    .aw-mode-card.active { border-color: var(--aw-accent); background: var(--aw-accent-soft); box-shadow: 0 0 0 1px var(--aw-accent) inset; }
    .aw-mode-icon { font-family: var(--font-mono); font-size: 0.72rem; line-height: 1; color: var(--aw-accent); letter-spacing: 0.06em; }
    .aw-mode-title { font-size: 0.85rem; font-weight: 700; color: var(--aw-strong); }
    .aw-mode-desc { font-size: 0.72rem; color: var(--aw-muted); line-height: 1.3; }

    /* Chips */
    .aw-chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .aw-chip {
      padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
      border: 1px solid var(--aw-border); background: transparent; color: var(--aw-faint); cursor: pointer;
      transition: all 0.15s;
    }
    .aw-chip.active { color: var(--chip-text); background: var(--chip-bg); border-color: var(--chip-border); }

    .aw-diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .aw-diff-card {
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      padding: 0.7rem 0.4rem; border-radius: 6px; border: 1px solid var(--aw-border);
      background: transparent; color: var(--aw-faint); font-size: 0.72rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .aw-diff-card.active { color: var(--chip-text); background: var(--chip-bg); border-color: var(--chip-border); }
    .aw-diff-card .aw-pts { opacity: 0.65; font-weight: 400; }

    .aw-pips { display: inline-flex; align-items: center; gap: 2px; }
    .aw-pip { width: 7px; height: 7px; border-radius: 50%; background: var(--aw-border); }
    .aw-pip.on { background: var(--pip-color); }

    .aw-count-note { color: var(--aw-border-strong); font-size: 0.72rem; text-align: right; margin: 0.4rem 0 0; }

    /* Team editor */
    .aw-team-row {
      display: flex; align-items: center; gap: 0.65rem; background: var(--aw-surface);
      border: 1px solid var(--team-border); border-radius: 6px; padding: 0.5rem 0.75rem; margin-bottom: 0.45rem;
    }
    .aw-team-swatch { width: 11px; height: 11px; border-radius: 50%; background: var(--team-bg); flex-shrink: 0; }
    .aw-team-input {
      flex: 1; min-width: 0; background: transparent; border: none; outline: none;
      color: var(--aw-strong); font-size: 0.85rem; font-weight: 500;
    }
    .aw-team-input::placeholder { color: var(--aw-border-strong); }
    .aw-team-remove {
      background: none; border: none; color: var(--aw-border-strong); cursor: pointer; font-size: 0.85rem;
      line-height: 1; padding: 0.2rem;
    }
    .aw-team-remove:hover { color: #FF7A8A; }
    .aw-add-team {
      width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px dashed var(--aw-border);
      background: transparent; color: var(--aw-border-strong); font-size: 0.8rem; cursor: pointer; transition: all 0.15s;
    }
    .aw-add-team:hover { color: var(--aw-muted); border-color: var(--aw-faint); }

    /* Generic buttons */
    .aw-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      border-radius: 6px; border: 1px solid var(--aw-border); background: var(--aw-surface); color: var(--aw-text);
      font-size: 0.82rem; font-weight: 600; padding: 0.65rem 1rem; cursor: pointer;
      transition: all 0.15s;
    }
    .aw-btn:hover { border-color: var(--aw-faint); }
    .aw-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .aw-btn-primary { background: var(--aw-accent); border-color: var(--aw-accent); color: var(--aw-bg); }
    .aw-btn-primary:hover { background: var(--aw-accent); border-color: var(--aw-accent); }
    .aw-btn-primary:disabled { background: var(--aw-surface); border-color: var(--aw-border); color: var(--aw-border-strong); }
    .aw-btn-ghost { background: transparent; color: var(--aw-faint); }
    .aw-btn-ghost:hover { color: var(--aw-muted); border-color: var(--aw-faint); }
    .aw-btn-success { background: #1F7A52; border-color: #1F7A52; color: var(--aw-strong); }
    .aw-btn-success:hover { background: #3FB483; border-color: #3FB483; }
    .aw-btn-danger { background: #B0243A; border-color: #B0243A; color: var(--aw-strong); }
    .aw-btn-danger:hover { background: #E0485E; border-color: #E0485E; }
    .aw-btn-block { width: 100%; }
    .aw-btn-lg { padding: 0.95rem 1rem; border-radius: 6px; font-size: 1rem; }
    .aw-btn-sub { display: block; font-size: 0.68rem; font-weight: 400; opacity: 0.75; margin-top: 0.15rem; }

    .aw-end-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .aw-end-row .aw-btn { flex: 1; }
    .aw-select {
      width: 100%; background: var(--aw-surface); border: 1px solid var(--aw-border); border-radius: 6px;
      padding: 0.55rem 0.75rem; color: var(--aw-strong); font-size: 0.82rem; outline: none;
    }

    .aw-howto {
      background: rgba(28,31,35,0.6); border: 1px solid var(--aw-border); border-radius: 6px;
      padding: 0.85rem 1rem; font-size: 0.75rem; color: var(--aw-muted); line-height: 1.55;
    }
    .aw-howto strong { color: var(--aw-muted); }

    .aw-history-row {
      display: flex; align-items: center; gap: 0.6rem; background: rgba(28,31,35,0.5);
      border-radius: 4px; padding: 0.45rem 0.7rem; font-size: 0.72rem; margin-bottom: 0.35rem; flex-wrap: wrap;
    }
    .aw-history-mode {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--aw-accent); background: var(--aw-accent-soft); border-radius: 999px; padding: 0.1rem 0.5rem;
    }
    .aw-history-date { color: var(--aw-border-strong); flex-shrink: 0; }
    .aw-history-winner { color: var(--aw-strong); font-weight: 600; flex-shrink: 0; }
    .aw-history-detail { color: var(--aw-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* In-game menu link */
    .aw-topline {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between;
      background: rgba(13,14,16,0.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--aw-surface);
      padding: 0.5rem 1rem;
    }
    .aw-menu-link {
      background: none; border: none; color: var(--aw-faint); font-size: 0.72rem; cursor: pointer; padding: 0.2rem 0;
    }
    .aw-menu-link:hover { color: var(--aw-muted); }
    .aw-topline-right { color: var(--aw-border-strong); font-size: 0.7rem; display: flex; align-items: center; gap: 0.6rem; }
    .aw-end-now { background: none; border: none; color: var(--aw-border-strong); font-size: 0.68rem; cursor: pointer; }
    .aw-end-now:hover { color: var(--aw-muted); }

    /* Scoreboard */
    .aw-scoreboard { position: sticky; top: 33px; z-index: 25; background: rgba(13,14,16,0.97); backdrop-filter: blur(6px); border-bottom: 1px solid var(--aw-surface); padding: 0.5rem 1rem; }
    .aw-scoreboard-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 0.6rem; }
    .aw-team-tiles { display: flex; gap: 0.4rem; flex-wrap: wrap; flex: 1; min-width: 0; }
    .aw-team-tile {
      display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 0.3rem 0.55rem;
      border-radius: 4px; border: 1px solid var(--aw-border); background: rgba(28,31,35,0.5); transition: all 0.15s;
    }
    .aw-team-tile.active { border-color: var(--team-border); background: var(--team-dim); box-shadow: 0 0 0 1px var(--team-border) inset; }
    .aw-team-tile-name { font-size: 0.62rem; font-weight: 700; color: var(--aw-faint); max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .aw-team-tile.active .aw-team-tile-name { color: var(--team-text); }
    .aw-team-tile-score { font-size: 0.95rem; font-weight: 800; color: var(--aw-strong); font-variant-numeric: tabular-nums; }
    .aw-team-tile.active .aw-team-tile-score { color: var(--team-text); }
    .aw-qcounter { color: var(--aw-faint); font-size: 0.68rem; text-align: right; flex-shrink: 0; }

    /* Question card */
    .aw-game-body { max-width: 760px; margin: 0 auto; padding: 1.1rem 1rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
    .aw-card { background: var(--aw-surface); border: 1px solid var(--aw-border); border-radius: 1.1rem; overflow: hidden; }
    .aw-card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; padding: 0.65rem 1.1rem; border-bottom: 1px solid rgba(58,62,69,0.7); background: rgba(28,31,35,0.6); }
    .aw-badges { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .aw-badge { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.68rem; font-weight: 700; padding: 0.18rem 0.6rem; border-radius: 999px; border: 1px solid var(--b-border); background: var(--b-bg); color: var(--b-text); }
    .aw-steal-flag { font-size: 0.72rem; font-weight: 700; color: #fbbf24; }

    .aw-qbody { padding: 1.8rem 1.3rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
    .aw-qtext { color: var(--aw-strong); font-size: 1.25rem; font-weight: 500; line-height: 1.5; margin: 0; }
    .aw-reveal-btn { background: var(--aw-border); border: 1px solid var(--aw-border-strong); color: var(--aw-muted); padding: 0.55rem 1.2rem; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .aw-reveal-btn:hover { background: var(--aw-border-strong); color: var(--aw-strong); }
    .aw-answer-block { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 0.7rem; }
    .aw-answer-box { background: rgba(13,14,16,0.6); border: 1px solid var(--aw-border); border-radius: 6px; padding: 0.9rem 1.1rem; color: var(--aw-text); font-size: 0.85rem; line-height: 1.55; }
    .aw-pearl-box { background: var(--aw-accent-soft); border: 1px solid var(--aw-accent-line); border-radius: 6px; padding: 0.75rem 1.1rem; display: flex; gap: 0.7rem; }
    .aw-pearl-tag { color: var(--aw-accent); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; flex-shrink: 0; padding-top: 0.1rem; }
    .aw-pearl-text { color: var(--aw-accent); font-size: 0.83rem; font-style: italic; margin: 0; }

    .aw-panel { display: flex; flex-direction: column; gap: 0.6rem; }
    .aw-panel-hint { text-align: center; color: var(--aw-border-strong); font-size: 0.72rem; margin: 0; }
    .aw-buzz-grid { display: grid; gap: 0.5rem; }
    .aw-buzz-btn { padding: 0.9rem 0.5rem; border-radius: 6px; border: none; background: var(--team-bg); color: var(--aw-bg); font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
    .aw-buzz-btn:hover { opacity: 0.9; }
    .aw-buzz-btn:active { transform: scale(0.97); }
    .aw-steal-btn { padding: 0.75rem 0.5rem; border-radius: 6px; border: 2px solid var(--team-border); background: var(--team-dim); color: var(--team-text); font-weight: 700; font-size: 0.82rem; cursor: pointer; }
    .aw-steal-btn:hover { opacity: 0.9; }

    .aw-verdict-name { text-align: center; font-size: 0.85rem; color: var(--aw-muted); margin: 0 0 0.15rem; }
    .aw-verdict-name strong { color: var(--team-text); }
    .aw-verdict-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
    .aw-verdict-btn { padding: 0.9rem 0.5rem; border-radius: 6px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--aw-strong); }
    .aw-verdict-correct { background: #1F7A52; }
    .aw-verdict-correct:hover { background: #3FB483; }
    .aw-verdict-wrong { background: #8A1C2E; }
    .aw-verdict-wrong:hover { background: #D23249; }

    /* Board */
    .aw-turn-flag { display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.55rem; border-radius: 6px; background: var(--team-dim); border: 1px solid var(--team-border); color: var(--team-text); font-size: 0.82rem; font-weight: 700; }
    .aw-board-scroll { overflow-x: auto; padding-bottom: 0.4rem; -webkit-overflow-scrolling: touch; }
    .aw-board { display: flex; gap: 0.5rem; width: max-content; min-width: 100%; }
    .aw-board-col { display: flex; flex-direction: column; gap: 0.4rem; width: 92px; flex: 0 0 auto; }
    .aw-board-col-header { text-align: center; font-size: 0.66rem; font-weight: 700; padding: 0.4rem 0.2rem; border-radius: 4px; border: 1px solid var(--b-border); background: var(--b-bg); color: var(--b-text); }
    .aw-board-cell {
      height: 52px; border-radius: 4px; border: 1px solid var(--aw-border); background: var(--aw-surface); color: var(--aw-accent);
      font-size: 0.95rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .aw-board-cell:hover { border-color: var(--aw-accent); background: var(--aw-accent-soft); }
    .aw-board-cell--done { background: rgba(28,31,35,0.4); color: var(--aw-border); cursor: default; border-style: dashed; }
    .aw-board-cell--empty { background: rgba(28,31,35,0.2); color: var(--aw-border); cursor: default; border-style: dashed; }
    @media (min-width: 700px) { .aw-board-col { width: auto; flex: 1 1 0; } }

    /* Modal */
    .aw-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .aw-modal { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }

    /* Quiz */
    .aw-quiz-topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.2rem; font-size: 0.72rem; color: var(--aw-faint); }
    .aw-quiz-score { color: var(--aw-accent); font-weight: 700; }
    .aw-choice-list { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.4rem; }
    .aw-choice {
      text-align: left; padding: 0.8rem 1rem; border-radius: 6px; border: 1px solid var(--aw-border);
      background: var(--aw-surface); color: var(--aw-text); font-size: 0.85rem; cursor: pointer; line-height: 1.4;
    }
    .aw-choice:hover:not(:disabled) { border-color: var(--aw-faint); }
    .aw-choice:disabled { cursor: default; }
    .aw-choice.correct { border-color: #1F7A52; background: rgba(95,211,160,0.14); color: #5FD3A0; }
    .aw-choice.wrong { border-color: #B0243A; background: rgba(255,122,138,0.14); color: #FF9DA9; }
    .aw-choice.dim { opacity: 0.5; }

    .aw-bar-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; font-size: 0.75rem; }
    .aw-bar-label { width: 108px; flex-shrink: 0; color: var(--aw-muted); }
    .aw-bar-track { flex: 1; height: 8px; border-radius: 999px; background: var(--aw-surface); overflow: hidden; }
    .aw-bar-fill { height: 100%; background: var(--aw-accent); border-radius: 999px; }
    .aw-bar-frac { width: 44px; text-align: right; color: var(--aw-faint); flex-shrink: 0; }

    /* Browse */
    .aw-browse-controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .aw-browse-controls .aw-select { width: auto; flex: 1 1 130px; }
    .aw-search { flex: 1 1 100%; background: var(--aw-surface); border: 1px solid var(--aw-border); border-radius: 6px; padding: 0.55rem 0.85rem; color: var(--aw-strong); font-size: 0.82rem; outline: none; }
    .aw-search::placeholder { color: var(--aw-border-strong); }
    .aw-browse-count { color: var(--aw-border-strong); font-size: 0.72rem; margin: -0.5rem 0 0.8rem; text-align: right; }
    .aw-browse-row { background: var(--aw-surface); border: 1px solid var(--aw-border); border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; cursor: pointer; }
    .aw-browse-row:hover { border-color: var(--aw-border-strong); }
    .aw-browse-q { color: var(--aw-text); font-size: 0.85rem; margin: 0.5rem 0 0; line-height: 1.45; }
    .aw-browse-expand { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .aw-empty-note { text-align: center; color: var(--aw-border-strong); font-size: 0.82rem; padding: 2rem 1rem; }

    /* Results */
    .aw-result-hero { text-align: center; margin-bottom: 1.75rem; }
    .aw-result-emoji { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--aw-accent); margin-bottom: 0.5rem; }
    .aw-result-title { font-size: 1.7rem; font-weight: 800; color: var(--aw-strong); margin: 0 0 0.2rem; }
    .aw-result-sub { color: var(--aw-faint); font-size: 0.82rem; margin: 0; }
    .aw-leaderboard-row {
      display: flex; align-items: center; gap: 0.7rem; border-radius: 6px; border: 1px solid var(--aw-border);
      background: rgba(28,31,35,0.4); padding: 0.85rem 1rem; margin-bottom: 0.5rem;
    }
    .aw-leaderboard-row.first { border-color: var(--team-border); background: var(--team-dim); }
    .aw-medal { font-size: 1.35rem; width: 2rem; text-align: center; flex-shrink: 0; }
    .aw-lb-name { flex: 1; font-weight: 700; color: var(--aw-strong); }
    .aw-leaderboard-row.first .aw-lb-name { color: var(--team-text); }
    .aw-lb-score-wrap { text-align: right; }
    .aw-lb-score { font-size: 1.4rem; font-weight: 800; color: var(--aw-strong); font-variant-numeric: tabular-nums; }
    .aw-leaderboard-row.first .aw-lb-score { color: var(--team-text); }
    .aw-lb-stats { font-size: 0.65rem; color: var(--aw-faint); }
    .aw-streak-banner { background: rgba(120,53,15,0.35); border: 1px solid #a16207; border-radius: 6px; padding: 0.7rem 1rem; text-align: center; color: #fde047; font-size: 0.82rem; margin-bottom: 1.25rem; }
    .aw-result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .aw-pct-hero { font-size: 3rem; font-weight: 800; color: var(--aw-accent); }

    @media (max-width: 420px) {
      .aw-h1 { font-size: 1.7rem; }
      .aw-verdict-grid { gap: 0.5rem; }
    }
  </style>
</head>
