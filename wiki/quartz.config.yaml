# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# =============================================================
# sk.oto — Quartz 5 config (scaffold; see wiki/README.md)
# Derived from Quartz 5's `obsidian` template (quartz/cli/templates/
# obsidian.yaml @ jackyzha0/quartz v5.0.0). Changes from the template
# are marked "sk:". Copy this file to the root of the Quartz repo.
# =============================================================
configuration:
  pageTitle: sk.oto  # sk:
  pageTitleSuffix: " · sk.oto"  # sk:
  enableSPA: true
  enablePopovers: true
  analytics: null  # sk: no trackers, same as the main site
  locale: en-US
  baseUrl: skflx.github.io/ent-wiki  # sk: project page of a separate repo (README §Hosting)
  ignorePatterns:  # sk: second line of defense; sync-vault.mjs is the first
    - private
    - templates
    - .obsidian
    - "**/_*"
    - "**/.*"
  theme:
    fontOrigin: local  # sk: fonts downloaded at build and served same-origin
    cdnCaching: false
    typography:  # sk: the main site's faces
      header: Archivo
      body: Archivo
      code: IBM Plex Mono
    colors:  # sk: css/site.css tokens (paper/ink; red = act, blue = science)
      lightMode:
        light: "#F1F1EC"
        lightgray: "#D6D7D0"
        gray: "#B4B6AE"
        darkgray: "#4A4F57"
        dark: "#121418"
        secondary: "#B8371A"
        tertiary: "#2445B0"
        highlight: rgba(36, 69, 176, 0.08)
        textHighlight: "#FFE58A99"
      darkMode:
        light: "#0D0E10"
        lightgray: "#26292E"
        gray: "#3A3E45"
        darkgray: "#A6AAB2"
        dark: "#ECEBE6"
        secondary: "#FF6B42"
        tertiary: "#8EA7FF"
        highlight: rgba(142, 167, 255, 0.10)
        textHighlight: "#B3AA0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      # disableBrokenWikilinks: false  # Set true to add a "broken" CSS class to internal links whose target is not in ctx.allSlugs.
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false  # sk: vault prose is written as paragraphs
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:  # sk: explicit, or the plugin falls back to its own Google Fonts
      fontOrigin: local  # @font-face lives in quartz/styles/custom.scss
      title: '"Archivo", system-ui, sans-serif'
      header: '"Archivo", system-ui, sans-serif'
      body: '"Archivo", system-ui, sans-serif'
      interface: '"IBM Plex Mono", ui-monospace, monospace'
      code: '"IBM Plex Mono", ui-monospace, monospace'
      useThemeFonts: false
  - source: "@quartz-themes/core"
    enabled: false  # sk: themed by colors above + quartz/styles/custom.scss
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:  # sk:
        skflx.MD: https://skflx.github.io/
        Tools: https://skflx.github.io/#tools
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false  # sk: the vault has no Excalidraw files
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
