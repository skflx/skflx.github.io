<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>Middle ear compartments: base (schematic)</title>
  <rect width="640" height="440" fill="#ffffff"/>
  <path d="M 110 70 L 530 70 Q 560 70 560 100 L 560 360 Q 560 390 530 390 L 110 390 Q 80 390 80 360 L 80 100 Q 80 70 110 70 Z" fill="#f8f4ec" stroke="#8a7b5f" stroke-width="2"/>
  <ellipse cx="320" cy="235" rx="110" ry="118" fill="none" stroke="#1d1d1b" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="210" y1="70" x2="210" y2="390" stroke="#555049" stroke-dasharray="3 5"/>
  <line x1="430" y1="70" x2="430" y2="390" stroke="#555049" stroke-dasharray="3 5"/>
  <line x1="80" y1="117" x2="560" y2="117" stroke="#555049" stroke-dasharray="3 5"/>
  <line x1="80" y1="353" x2="560" y2="353" stroke="#555049" stroke-dasharray="3 5"/>
