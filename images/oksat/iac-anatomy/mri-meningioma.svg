<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1b">
  <title>CPA meningioma (axial MRI, schematic)</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold">Meningioma (broad dural base, eccentric to porus, schematic)</text>
  <path d="M 120 80 L 640 360 L 640 80 Z" fill="#efe6d2" stroke="none"/>
  <line x1="120" y1="80" x2="362" y2="210" stroke="#8a7b5f" stroke-width="2.5"/>
  <line x1="398" y1="230" x2="640" y2="360" stroke="#8a7b5f" stroke-width="2.5"/>
  <polygon points="195,120 354,206 361,192 202,107" fill="#ddd0b4" stroke="#8a7b5f" stroke-width="1.2"/>
  <g data-g="iac"><rect x="380" y="198" width="130" height="28" transform="rotate(-28 380 212)" fill="#555049" fill-opacity="0.85" stroke="#8a7b5f" stroke-width="1.4"/></g>
  <g data-g="porus"><line x1="362" y1="210" x2="398" y2="230" stroke="#2F6E6A" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <path d="M 195.1 120.4 A 90 90 0 0 0 353.5 205.8 Z" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.5"/>
  <line x1="195.1" y1="120.4" x2="124.7" y2="82.5" stroke="#1d1d1b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 173 108 A 24 24 0 0 0 185 142" fill="none" stroke="#2F6E6A" stroke-width="2"/>
  <path d="M 332 222 A 24 24 0 0 0 374 218" fill="none" stroke="#2F6E6A" stroke-width="2"/>
  <g data-label="1" font-size="12.5">
    <text x="236" y="294" text-anchor="middle" font-weight="bold" fill="#2F6E6A">Broad dural base, obtuse angles</text>
    <line x1="160" y1="102" x2="112" y2="148" stroke="#555049" stroke-width="1"/>
    <text x="112" y="164" text-anchor="middle">Dural tail (non-specific)</text>
    <line x1="286" y1="152" x2="318" y2="94" stroke="#555049" stroke-width="1"/>
    <text x="324" y="92" text-anchor="start" font-weight="bold">Hyperostosis (strong sign)</text>
    <text x="402" y="296" text-anchor="start" fill="#555049">Porus not flared</text>
  </g>
  <g data-label="1" font-size="11" fill="#555049">
    <line x1="46" y1="376" x2="82" y2="376" stroke="#555049" stroke-width="1.2"/>
    <line x1="64" y1="358" x2="64" y2="394" stroke="#555049" stroke-width="1.2"/>
    <text x="64" y="354" text-anchor="middle" font-weight="bold">A</text>
    <text x="64" y="406" text-anchor="middle" font-weight="bold">P</text>
    <text x="41" y="380" text-anchor="end" font-weight="bold">M</text>
    <text x="87" y="380" text-anchor="start" font-weight="bold">L</text>
    <text x="64" y="421" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d1d1b">Right ear</text>
  </g>
</svg>
