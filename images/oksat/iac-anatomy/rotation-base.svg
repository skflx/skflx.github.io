<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1b">
  <title>Nerve rotation along the right IAC, fundus to brainstem (base, schematic)</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="490" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#2F6E6A">≈ 90° counterclockwise, fundus → brainstem (right ear, as drawn)</text>
  <path d="M 180 38 Q 490 22 800 38" fill="none" stroke="#2F6E6A" stroke-width="1.8"/>
  <polygon points="804,38 795,33 796,42" fill="#2F6E6A"/>
  <text x="130" y="62" text-anchor="middle" font-size="14" font-weight="bold">1 · Fundus</text>
  <circle cx="130" cy="200" r="90" fill="#f6e3d4" stroke="#8c4b3e" stroke-width="1.2"/>
  <text x="370" y="62" text-anchor="middle" font-size="14" font-weight="bold">2 · Mid-canal</text>
  <circle cx="370" cy="200" r="90" fill="#f6e3d4" stroke="#8c4b3e" stroke-width="1.2"/>
  <text x="610" y="62" text-anchor="middle" font-size="14" font-weight="bold">3 · Porus</text>
  <circle cx="610" cy="200" r="90" fill="#f6e3d4" stroke="#8c4b3e" stroke-width="1.2"/>
  <text x="850" y="62" text-anchor="middle" font-size="14" font-weight="bold">4 · Cerebellopontine angle</text>
  <circle cx="850" cy="200" r="90" fill="none" stroke="#555049" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="850" y="92" text-anchor="middle" font-size="12" fill="#555049">cistern: no canal</text>
  <g data-label="1" font-size="11" fill="#555049">
    <line x1="48" y1="316" x2="84" y2="316" stroke="#555049" stroke-width="1.2"/>
    <line x1="66" y1="298" x2="66" y2="334" stroke="#555049" stroke-width="1.2"/>
    <text x="66" y="294" text-anchor="middle" font-weight="bold">S</text>
    <text x="66" y="346" text-anchor="middle" font-weight="bold">I</text>
    <text x="43" y="320" text-anchor="end" font-weight="bold">A</text>
    <text x="89" y="320" text-anchor="start" font-weight="bold">P</text>
    <text x="108" y="320" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1d1d1b">Right ear, viewed from medial</text>
  </g>
  <text x="20" y="365" font-size="12" fill="#555049">Almost all of the turn happens inside the canal. In about 1 in 4 there is no cleavage plane: one fused trunk. The left ear turns the other way.</text>
</svg>
