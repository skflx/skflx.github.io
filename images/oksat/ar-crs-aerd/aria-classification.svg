<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>ARIA classification: duration grid, severity, and the separate seasonal axis (schematic)</title>
  <rect width="840" height="470" fill="#ffffff"/>

  <text x="20" y="30" font-weight="bold">A · Duration: persistent needs both fours</text>
  <text x="520" y="30" font-weight="bold">B · Severity</text>

  <!-- grid -->
  <rect x="110" y="60" width="180" height="140" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.4"/>
  <rect x="290" y="60" width="180" height="140" fill="#f6e4e1" stroke="#b23a2e" stroke-width="2"/>
  <rect x="110" y="200" width="180" height="140" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.4"/>
  <rect x="290" y="200" width="180" height="140" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.4"/>
  <text x="380" y="88" text-anchor="middle" font-weight="bold" fill="#b23a2e">Persistent</text>
  <text x="200" y="88" text-anchor="middle" font-weight="bold" fill="#444">Intermittent</text>
  <text x="200" y="228" text-anchor="middle" font-weight="bold" fill="#444">Intermittent</text>
  <text x="380" y="228" text-anchor="middle" font-weight="bold" fill="#444">Intermittent</text>

  <!-- axes labels -->
  <g font-size="13" text-anchor="middle">
    <text x="200" y="360">&lt;4 days/week</text>
    <text x="380" y="360">&gt;4 days/week</text>
  </g>
  <text x="290" y="384" text-anchor="middle" font-size="12.5" fill="#444">days per week with symptoms</text>
  <g font-size="13" text-anchor="end">
    <text x="102" y="126">≥4</text><text x="102" y="142">consecutive</text><text x="102" y="158">weeks</text>
    <text x="102" y="266">&lt;4</text><text x="102" y="282">consecutive</text><text x="102" y="298">weeks</text>
  </g>

  <!-- example patients -->
  <circle cx="380" cy="132" r="9" fill="#b23a2e"/>
  <text x="380" y="160" text-anchor="middle" font-size="12.5">grass: 6 d/wk for 8 weeks</text>
  <text x="380" y="176" text-anchor="middle" font-size="12.5" font-weight="bold">seasonal + persistent</text>

  <circle cx="200" cy="132" r="9" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/>
  <text x="200" y="160" text-anchor="middle" font-size="12.5">HDM: 2 d/wk all year</text>
  <text x="200" y="176" text-anchor="middle" font-size="12.5" font-weight="bold">perennial + intermittent</text>

  <circle cx="380" cy="272" r="9" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/>
  <text x="380" y="300" text-anchor="middle" font-size="12.5">tree: daily for 2 weeks</text>
  <text x="380" y="316" text-anchor="middle" font-size="12.5" font-weight="bold">seasonal + intermittent</text>

  <text x="20" y="414" font-size="12.5">Seasonal / perennial is a different axis: it describes the <tspan font-weight="bold">allergen</tspan> (outdoor pollen vs indoor HDM, dander, insects;</text>
  <text x="20" y="430" font-size="12.5">molds either). Intermittent / persistent describes the <tspan font-weight="bold">pattern of symptoms</tspan>. Any pairing is possible.</text>

  <!-- severity -->
  <rect x="520" y="60" width="300" height="70" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.2"/>
  <text x="534" y="84" font-weight="bold">Mild</text>
  <text x="534" y="106" font-size="13">none of the four impairments below</text>

  <rect x="520" y="146" width="300" height="168" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.6"/>
  <text x="534" y="170" font-weight="bold" fill="#b23a2e">Moderate–severe</text>
  <text x="534" y="190" font-size="13"><tspan font-weight="bold">≥1</tspan> of:</text>
  <g font-size="13">
    <rect x="536" y="204" width="12" height="12" fill="#ffffff" stroke="#1d1d1b"/><text x="558" y="215">sleep disturbance</text>
    <rect x="536" y="230" width="12" height="12" fill="#ffffff" stroke="#1d1d1b"/><text x="558" y="241">impaired daily, leisure or sport activity</text>
    <rect x="536" y="256" width="12" height="12" fill="#ffffff" stroke="#1d1d1b"/><text x="558" y="267">impaired school or work</text>
    <rect x="536" y="282" width="12" height="12" fill="#ffffff" stroke="#1d1d1b"/><text x="558" y="293">troublesome symptoms</text>
  </g>
  <text x="20" y="458" font-size="12" fill="#444">Schematic. ARIA as summarized in ICAR V. Persistent: &gt;4 days/week and ≥4 consecutive weeks; falling short on either is intermittent.</text>
</svg>
