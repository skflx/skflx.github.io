<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1d1d1b">
  <title>Outcome scales: range and direction of improvement</title>
  <rect width="800" height="430" fill="#ffffff"/>

  <text x="20" y="28" font-weight="bold" font-size="15">Which way is better? Read every result against its scale</text>
  <text x="20" y="48" font-size="13" fill="#444">Dupilumab AERD subgroup, SINUS-24/52, as printed in Priessnitz §3.2.2 and as it should read</text>

  <!-- header -->
  <g font-size="12.5" font-weight="bold" fill="#444">
    <text x="20" y="82">Scale</text><text x="250" y="82">Range</text><text x="350" y="82">Better is</text>
    <text x="490" y="82">Printed</text><text x="630" y="82">Read as</text>
  </g>
  <line x1="20" y1="92" x2="780" y2="92" stroke="#1d1d1b" stroke-width="1.2"/>

  <g>
    <text x="20" y="120">Nasal polyp score (NPS)</text><text x="250" y="120">0–8</text><text x="350" y="120">lower ↓</text>
    <text x="490" y="120" fill="#b23a2e">+1.89</text><text x="630" y="120" font-weight="bold">−1.89</text>
    <text x="20" y="152">Nasal congestion (NCS)</text><text x="250" y="152">0–3</text><text x="350" y="152">lower ↓</text>
    <text x="490" y="152" fill="#b23a2e">+1.17</text><text x="630" y="152" font-weight="bold">−1.17</text>
    <text x="20" y="184">SNOT-22</text><text x="250" y="184">0–110</text><text x="350" y="184">lower ↓</text>
    <text x="490" y="184" fill="#b23a2e">+24.35</text><text x="630" y="184" font-weight="bold">−24.35</text>
    <text x="20" y="216">Lund–Mackay CT (LMS)</text><text x="250" y="216">0–24</text><text x="350" y="216">lower ↓</text>
    <text x="490" y="216" fill="#b23a2e">"increase" +6.33</text><text x="630" y="216" font-weight="bold">−6.33</text>
    <text x="20" y="248">UPSIT (smell)</text><text x="250" y="248">0–40</text><text x="350" y="248" fill="#2f5d8a" font-weight="bold">higher ↑</text>
    <text x="490" y="248">+10.17</text><text x="630" y="248" font-weight="bold">+10.17</text>
  </g>
  <line x1="20" y1="262" x2="780" y2="262" stroke="#cfcdc7" stroke-width="1"/>
  <g>
    <text x="20" y="290">ACT (asthma control)</text><text x="250" y="290">5–25</text><text x="350" y="290" fill="#2f5d8a" font-weight="bold">higher ↑</text>
    <text x="490" y="290" fill="#444" font-size="13">e.g. +5.1 on mepolizumab (Tuttle)</text>
    <text x="20" y="322">ACQ-6 (asthma control)</text><text x="250" y="322">0–6</text><text x="350" y="322">lower ↓</text>
    <text x="490" y="322" fill="#444" font-size="13">e.g. −1.3 on dupilumab (Buchheit)</text>
    <text x="20" y="354">FEV1</text><text x="250" y="354">% predicted, L</text><text x="350" y="354" fill="#2f5d8a" font-weight="bold">higher ↑</text>
    <text x="490" y="354" fill="#444" font-size="13">e.g. +0.23 L (tezepelumab, pooled)</text>
  </g>
  <line x1="20" y1="368" x2="780" y2="368" stroke="#1d1d1b" stroke-width="1.2"/>

  <g font-size="12.5" fill="#444">
    <text x="20" y="392">Red: printed with the wrong sign; the review itself calls these improvements. Blue: scales where a rise is good.</text>
    <text x="20" y="410">Top rows: differences vs placebo. Bottom examples: other studies in this module. ACT, ACQ ranges: knowledge addition.</text>
  </g>
</svg>
