<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>Anti-IL-5 versus anti-IL-5Rα (schematic)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/></marker>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>
  <line x1="410" y1="20" x2="410" y2="330" stroke="#cfcdc7" stroke-width="1.2"/>

  <!-- LEFT: ligand neutralization -->
  <text x="205" y="32" text-anchor="middle" font-weight="bold">Mepolizumab · reslizumab</text>
  <text x="205" y="52" text-anchor="middle" font-size="13.5" fill="#444">bind IL-5, the ligand</text>
  <!-- antibody holding IL-5 -->
  <circle cx="120" cy="120" r="22" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.6"/>
  <text x="120" y="125" text-anchor="middle" font-size="13.5" font-weight="bold">IL-5</text>
  <path d="M120,186 L120,160 M120,160 L106,142 M120,160 L134,142" stroke="#b23a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="120" y="210" text-anchor="middle" font-size="12.5" fill="#b23a2e">antibody</text>
  <!-- eosinophil with empty receptor -->
  <circle cx="290" cy="200" r="58" fill="#f7efe4" stroke="#1d1d1b" stroke-width="1.6"/>
  <ellipse cx="274" cy="196" rx="16" ry="12" fill="#cdbfae"/>
  <ellipse cx="306" cy="206" rx="16" ry="12" fill="#cdbfae"/>
  <rect x="226" y="148" width="12" height="22" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4" transform="rotate(-40 232 159)"/>
  <text x="290" y="282" text-anchor="middle" font-size="13">eosinophil (IL-5Rα, CD125, empty)</text>
  <path d="M146,124 L222,150" stroke="#1d1d1b" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
  <text x="190" y="128" font-size="12.5" fill="#444">cannot reach receptor</text>
  <text x="205" y="308" text-anchor="middle" font-size="13.5">No IL-5 signal → less maturation,</text>
  <text x="205" y="326" text-anchor="middle" font-size="13.5">recruitment and survival</text>

  <!-- RIGHT: receptor targeting + ADCC -->
  <text x="615" y="32" text-anchor="middle" font-weight="bold">Benralizumab</text>
  <text x="615" y="52" text-anchor="middle" font-size="13.5" fill="#444">binds IL-5Rα (CD125) on the eosinophil; afucosylated Fc</text>
  <circle cx="540" cy="190" r="58" fill="#f7efe4" stroke="#1d1d1b" stroke-width="1.6"/>
  <ellipse cx="524" cy="186" rx="16" ry="12" fill="#cdbfae"/>
  <ellipse cx="556" cy="196" rx="16" ry="12" fill="#cdbfae"/>
  <rect x="592" y="174" width="22" height="12" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4"/>
  <!-- antibody bridging to NK cell -->
  <path d="M614,180 L632,180 M632,180 L646,166 M632,180 L646,194" stroke="#b23a2e" stroke-width="3" fill="none" stroke-linecap="round" transform="rotate(180 630 180)"/>
  <path d="M632,180 L664,180" stroke="#b23a2e" stroke-width="3" fill="none"/>
  <rect x="664" y="172" width="14" height="16" rx="3" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4"/>
  <circle cx="732" cy="180" r="54" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.8"/>
  <text x="732" y="176" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d8a">NK cell</text>
  <text x="732" y="193" text-anchor="middle" font-size="11.5" fill="#2f5d8a">FcγRIIIa</text>
  <text x="732" y="207" text-anchor="middle" font-size="11.5" fill="#2f5d8a">(CD16)</text>
  <text x="540" y="272" text-anchor="middle" font-size="13">eosinophil (or basophil)</text>
  <text x="615" y="308" text-anchor="middle" font-size="13.5">ADCC → apoptosis: near-complete</text>
  <text x="615" y="326" text-anchor="middle" font-size="13.5">depletion in blood and tissue</text>

  <!-- shared bottom message -->
  <rect x="20" y="350" width="780" height="80" rx="6" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.2"/>
  <text x="410" y="374" text-anchor="middle" font-size="14" font-weight="bold">Either way the eosinophil goes, and the rest of the cascade does not.</text>
  <text x="410" y="397" text-anchor="middle" font-size="13.5">IL-4/IL-13 signalling, mast cells and leukotrienes continue, which is why asthma can settle</text>
  <text x="410" y="417" text-anchor="middle" font-size="13.5">while polyps and anosmia persist. A blood eosinophil count on these drugs reports the drug.</text>
  <text x="20" y="452" font-size="12.5" fill="#444">Schematic, not to scale. FcγRIIIa binding and afucosylation are standard pharmacology (knowledge addition); Priessnitz §3.3–3.4.</text>
</svg>
