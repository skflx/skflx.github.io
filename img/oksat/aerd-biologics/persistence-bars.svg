<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1b">
  <title>Real-world persistence on biologics and ATAD in AERD</title>
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- Panel A -->
  <text x="20" y="28" font-weight="bold" font-size="15">A · Still prescribed at study end (Wangberg 2022, 74 AERD patients)</text>
  <g font-size="13.5">
    <text x="20" y="72">Anti-IL-4Rα (dupilumab)</text>
    <text x="20" y="108">Anti-IgE (omalizumab)</text>
    <text x="20" y="144">Anti-IL-5 / IL-5Rα</text>
  </g>
  <line x1="230" y1="48" x2="230" y2="160" stroke="#1d1d1b" stroke-width="1.2"/>
  <line x1="680" y1="48" x2="680" y2="160" stroke="#cfcdc7" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="680" y="44" text-anchor="middle" font-size="11.5" fill="#444">100%</text>
  <g fill="#1d1d1b">
    <path d="M230,56 H667 a4,4 0 0 1 4,4 V74 a4,4 0 0 1 -4,4 H230 z"/>
    <path d="M230,92 H444.7 a4,4 0 0 1 4,4 V110 a4,4 0 0 1 -4,4 H230 z"/>
    <path d="M230,128 H347 a4,4 0 0 1 4,4 V146 a4,4 0 0 1 -4,4 H230 z"/>
  </g>
  <g font-size="13.5">
    <text x="660" y="72" text-anchor="end" fill="#ffffff" font-weight="bold">98% (49/50)</text>
    <text x="458" y="108">48.6% (17/35)</text>
    <text x="360" y="144">26.9% (7/26)</text>
  </g>
  <text x="20" y="184" font-size="12.5" fill="#444">The other biologics were stopped mostly for inadequate sinonasal response (Priessnitz §3.6). Retrospective; channelling likely.</text>

  <!-- Panel B -->
  <text x="20" y="232" font-weight="bold" font-size="15">B · Discontinuation, ATAD vs biologics (Kumar 2026; approximate)</text>
  <g font-size="13.5">
    <text x="20" y="276">ATAD</text>
    <text x="20" y="312">Biologics</text>
  </g>
  <line x1="230" y1="252" x2="230" y2="326" stroke="#1d1d1b" stroke-width="1.2"/>
  <!-- persisted segments -->
  <rect x="230" y="260" width="268" height="22" fill="#1d1d1b"/>
  <rect x="230" y="296" width="358" height="22" fill="#1d1d1b"/>
  <!-- discontinued segments (2px gap) -->
  <path d="M500,260 H676 a4,4 0 0 1 4,4 V278 a4,4 0 0 1 -4,4 H500 z" fill="#efc9c3"/>
  <path d="M590,296 H676 a4,4 0 0 1 4,4 V314 a4,4 0 0 1 -4,4 H590 z" fill="#efc9c3"/>
  <g font-size="13" font-weight="bold">
    <text x="240" y="276" fill="#ffffff">persisted ≈60%</text>
    <text x="510" y="276" fill="#7a2018">stopped ≈40%</text>
    <text x="240" y="312" fill="#ffffff">persisted ≈80%</text>
    <text x="598" y="312" fill="#7a2018">≈20%</text>
  </g>

  <rect x="20" y="344" width="760" height="58" rx="6" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.1"/>
  <text x="400" y="368" text-anchor="middle" font-size="13.5" font-weight="bold">Discontinuation ratio 40 / 20 = 2.0. Persistence ratio 80 / 60 = 1.33.</text>
  <text x="400" y="388" text-anchor="middle" font-size="13.5">Twice the discontinuation is not twice the persistence.</text>
  <text x="20" y="428" font-size="12.5" fill="#444">Utilization data describe what was done, not what works: biologic patients were younger, and severity and insurance differed.</text>
  <text x="20" y="444" font-size="12.5" fill="#444">About 25% of patients switched agents. Percentages in B are the rounded figures quoted by Priessnitz §5.1.</text>
</svg>
