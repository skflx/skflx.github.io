<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>Chandler stages placed on an axial orbit (schematic)</title>
  <defs>
    <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#f2f2ef"/><path d="M0,0 H22 V22" fill="none" stroke="#8a8a85" stroke-width="1.2"/>
    </pattern>
    <pattern id="infl" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#b23a2e" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="860" height="600" fill="#ffffff"/>

  <text x="20" y="30" font-weight="bold">Where each stage sits: the septum and the periorbita are the boundaries</text>
  <text x="20" y="52" font-size="12.5" fill="#444">Axial view, one orbit. Anterior is up; medial (ethmoid) is left.</text>

  <!-- ethmoid air cells medial to lamina papyracea -->
  <path d="M150,140 L276,140 L300,420 L170,420 Z" fill="url(#cells)" stroke="#1d1d1b" stroke-width="1.2"/>
  <text x="200" y="438" text-anchor="middle" font-size="12.5" fill="#444">ethmoid cells</text>

  <!-- orbital fat region: between lamina (medial) and lateral wall, apex posterior -->
  <path d="M286,150 L330,420 L410,500 L470,420 L590,190 C560,170 330,160 286,150 Z" fill="#f7efe4" stroke="none"/>
  <!-- stage 2: diffuse cellulitis overlay on fat -->
  <path d="M286,150 L330,420 L410,500 L470,420 L590,190 C560,170 330,160 286,150 Z" fill="url(#infl)" stroke="none"/>

  <!-- medial wall: lamina papyracea -->
  <path d="M278,130 L302,420 L410,505" stroke="#1d1d1b" stroke-width="3" fill="none"/>
  <!-- periorbita (just inside the wall) -->
  <path d="M290,152 L314,414 L410,492" stroke="#2f5d8a" stroke-width="1.6" fill="none" stroke-dasharray="6 3"/>
  <!-- lateral wall -->
  <path d="M600,176 L470,420 L410,505" stroke="#1d1d1b" stroke-width="3" fill="none"/>
  <path d="M586,184 L462,414" stroke="#2f5d8a" stroke-width="1.6" fill="none" stroke-dasharray="6 3"/>

  <!-- rectus muscles -->
  <path d="M322,230 C330,300 350,380 400,470 L410,470 C370,380 344,300 338,232 Z" fill="#cdbfae" stroke="#1d1d1b" stroke-width="1"/>
  <path d="M548,236 C530,300 500,380 420,470 L430,472 C510,384 540,310 562,242 Z" fill="#cdbfae" stroke="#1d1d1b" stroke-width="1"/>
  <text x="328" y="300" font-size="11" fill="#444" transform="rotate(80 328 300)">medial rectus</text>
  <text x="566" y="282" font-size="11" fill="#444" transform="rotate(-62 566 282)">lateral rectus</text>

  <!-- optic nerve -->
  <path d="M440,226 C440,320 420,420 412,500" stroke="#1d1d1b" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M440,226 C440,320 420,420 412,500" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="448" y="330" font-size="11" fill="#444">optic n.</text>

  <!-- globe -->
  <circle cx="440" cy="150" r="78" fill="#ffffff" stroke="#1d1d1b" stroke-width="2"/>
  <ellipse cx="440" cy="76" rx="30" ry="8" fill="#e7edf3" stroke="#1d1d1b" stroke-width="1"/>
  <text x="440" y="156" text-anchor="middle" font-size="13" fill="#444">globe</text>

  <!-- lids and septum -->
  <path d="M300,96 C340,58 400,52 432,58" stroke="#8a6d4b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M580,106 C540,64 480,54 448,58" stroke="#8a6d4b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <text x="600" y="96" font-size="12" fill="#444">eyelid</text>
  <!-- orbital septum: rim to tarsus -->
  <path d="M278,130 C290,108 300,104 312,98" stroke="#1d1d1b" stroke-width="2.2" fill="none"/>
  <path d="M600,176 C600,140 588,120 574,110" stroke="#1d1d1b" stroke-width="2.2" fill="none"/>
  <text x="200" y="104" font-size="12.5" font-weight="bold">orbital septum</text>
  <path d="M296,104 L288,112" stroke="#1d1d1b" stroke-width="1" fill="none"/>
  <text x="620" y="160" font-size="12.5" font-weight="bold">orbital septum</text>
  <path d="M618,156 L598,140" stroke="#1d1d1b" stroke-width="1" fill="none"/>

  <!-- stage 3: subperiosteal abscess: between lamina and periorbita -->
  <path d="M282,210 C300,214 310,260 306,320 C304,330 298,334 292,330 Z" fill="#b23a2e" opacity="0.85"/>
  <!-- stage 4: orbital abscess within fat -->
  <ellipse cx="500" cy="300" rx="22" ry="30" fill="#b23a2e" opacity="0.85"/>

  <!-- cavernous sinus -->
  <rect x="356" y="520" width="112" height="40" rx="6" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.6"/>
  <text x="412" y="545" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d8a">cavernous sinus</text>
  <path d="M462,228 C470,330 452,430 432,520" stroke="#2f5d8a" stroke-width="2" fill="none"/>
  <text x="478" y="500" font-size="11" fill="#2f5d8a">superior ophthalmic v.</text>
  <text x="478" y="513" font-size="11" fill="#2f5d8a">(valveless) to the sinus</text>
  <!-- sphenoid -->
  <rect x="220" y="470" width="110" height="80" rx="6" fill="url(#cells)" stroke="#1d1d1b" stroke-width="1.2"/>
  <text x="275" y="566" text-anchor="middle" font-size="12.5" fill="#444">sphenoid</text>
  <path d="M330,530 L354,536" stroke="#b23a2e" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- stage markers -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="346" cy="66" r="12" fill="#1d1d1b"/><text x="346" y="71">1</text>
    <circle cx="380" cy="250" r="12" fill="#1d1d1b"/><text x="380" y="255">2</text>
    <circle cx="256" cy="270" r="12" fill="#1d1d1b"/><text x="256" y="275">3</text>
    <circle cx="536" cy="272" r="12" fill="#1d1d1b"/><text x="536" y="277">4</text>
    <circle cx="492" cy="560" r="12" fill="#1d1d1b"/><text x="492" y="565">5</text>
  </g>
  <path d="M268,270 L290,270" stroke="#1d1d1b" stroke-width="1"/>

  <!-- legend -->
  <g font-size="13">
    <text x="650" y="230" font-weight="bold">1 Preseptal cellulitis</text>
    <text x="650" y="246" fill="#444" font-size="12">in front of the septum: the lid</text>
    <text x="650" y="262" fill="#444" font-size="12">no proptosis, full movements</text>
    <text x="650" y="290" font-weight="bold">2 Orbital cellulitis</text>
    <text x="650" y="306" fill="#444" font-size="12">diffuse, in the orbital fat</text>
    <text x="650" y="334" font-weight="bold">3 Subperiosteal abscess</text>
    <text x="650" y="350" fill="#444" font-size="12">between lamina papyracea</text>
    <text x="650" y="366" fill="#444" font-size="12">and periorbita, next to ethmoid</text>
    <text x="650" y="394" font-weight="bold">4 Orbital abscess</text>
    <text x="650" y="410" fill="#444" font-size="12">a collection inside the periorbita</text>
    <text x="650" y="438" font-weight="bold">5 Cavernous sinus thrombosis</text>
    <text x="650" y="454" fill="#444" font-size="12">behind the apex: intracranial</text>
  </g>
  <rect x="640" y="474" width="210" height="94" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.2"/>
  <text x="650" y="494" font-size="12.5" font-weight="bold" fill="#b23a2e">Behind the septum (2–5):</text>
  <text x="650" y="512" font-size="12">proptosis, chemosis, painful</text>
  <text x="650" y="528" font-size="12">ophthalmoplegia → IV antibiotics</text>
  <text x="650" y="544" font-size="12">+ contrast CT; colour vision is</text>
  <text x="650" y="560" font-size="12">an early sign of deterioration</text>
  <g font-size="12" fill="#444">
    <text x="650" y="74"><tspan stroke="#2f5d8a" fill="#2f5d8a">- - -</tspan> periorbita</text>
    <text x="650" y="92"><tspan fill="#b23a2e" font-weight="bold">■</tspan> abscess · <tspan fill="#b23a2e">∴</tspan> cellulitis</text>
  </g>

  <text x="20" y="592" font-size="12" fill="#444">Schematic, not to scale. EPOS 4.7. Critique: 1 is an eyelid infection, rarely sinogenic; 5 is intracranial, and more often sphenoid than ethmoid in origin.</text>
</svg>
