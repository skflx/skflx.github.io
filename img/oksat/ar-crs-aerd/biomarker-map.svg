<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>Which biomarker reads which pathway, and which drug it points to (schematic)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/></marker>
  </defs>
  <rect width="840" height="470" fill="#ffffff"/>

  <text x="20" y="30" font-weight="bold">Each test reads one arm of the cascade, so it can only point to the drug aimed at that arm</text>
  <g font-size="12.5" fill="#444" font-weight="bold">
    <text x="20" y="58">Biomarker</text><text x="300" y="58">Arm it reports</text><text x="600" y="58">Points to</text>
  </g>

  <!-- row 1 -->
  <rect x="20" y="70" width="220" height="62" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="32" y="94" font-weight="bold">Blood eosinophils</text>
  <text x="32" y="114" font-size="12">most available; partial in AERD</text>
  <rect x="300" y="70" width="220" height="62" rx="4" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.3"/>
  <text x="312" y="94" font-weight="bold" fill="#2f5d8a">IL-5 → eosinophil</text>
  <text x="312" y="114" font-size="12">maturation, survival, recruitment</text>
  <rect x="600" y="70" width="220" height="62" rx="4" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.3"/>
  <text x="612" y="94" font-weight="bold" fill="#b23a2e">anti-IL-5 / IL-5Rα</text>
  <text x="612" y="114" font-size="12">predicts mepolizumab, benralizumab</text>

  <!-- row 2 -->
  <rect x="20" y="148" width="220" height="62" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="32" y="172" font-weight="bold">FeNO</text>
  <text x="32" y="192" font-size="12">exhaled nitric oxide</text>
  <rect x="300" y="148" width="220" height="62" rx="4" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.3"/>
  <text x="312" y="172" font-weight="bold" fill="#2f5d8a">IL-4 / IL-13</text>
  <text x="312" y="192" font-size="12">epithelial iNOS induction</text>
  <rect x="600" y="148" width="220" height="62" rx="4" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.3"/>
  <text x="612" y="172" font-weight="bold" fill="#b23a2e">dupilumab, tezepelumab</text>
  <text x="612" y="192" font-size="12">may predict benefit</text>

  <!-- row 3 -->
  <rect x="20" y="226" width="220" height="62" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="32" y="250" font-weight="bold">Total IgE (+ weight)</text>
  <text x="32" y="270" font-size="12">needed to dose, not to choose</text>
  <rect x="300" y="226" width="220" height="62" rx="4" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.3"/>
  <text x="312" y="250" font-weight="bold" fill="#2f5d8a">IgE → FcεRI</text>
  <text x="312" y="270" font-size="12">mast cells, basophils</text>
  <rect x="600" y="226" width="220" height="62" rx="4" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.3"/>
  <text x="612" y="250" font-weight="bold" fill="#b23a2e">omalizumab</text>
  <text x="612" y="270" font-size="12">best in atopic phenotypes</text>

  <!-- row 4 -->
  <rect x="20" y="304" width="220" height="62" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="32" y="328" font-weight="bold">Urinary LTE4</text>
  <text x="32" y="348" font-size="12">assay access, thresholds limit use</text>
  <rect x="300" y="304" width="220" height="62" rx="4" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.3"/>
  <text x="312" y="328" font-weight="bold" fill="#2f5d8a">5-LO → cysteinyl LTs</text>
  <text x="312" y="348" font-size="12">tracks AERD activity, reactions</text>
  <rect x="600" y="304" width="220" height="62" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="612" y="328" font-weight="bold">AERD, not a drug choice</text>
  <text x="612" y="348" font-size="12">falls after ESS; zileuton lowers it</text>

  <g stroke="#1d1d1b" stroke-width="1.5" fill="none">
    <path d="M240,101 L296,101" marker-end="url(#arr)"/><path d="M520,101 L596,101" marker-end="url(#arr)"/>
    <path d="M240,179 L296,179" marker-end="url(#arr)"/><path d="M520,179 L596,179" marker-end="url(#arr)"/>
    <path d="M240,257 L296,257" marker-end="url(#arr)"/><path d="M520,257 L596,257" marker-end="url(#arr)"/>
    <path d="M240,335 L296,335" marker-end="url(#arr)"/><path d="M520,335 L596,335" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  </g>

  <rect x="20" y="384" width="800" height="56" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1"/>
  <text x="32" y="406" font-size="13"><tspan font-weight="bold">On treatment, the marker reports the drug:</tspan> eosinophils near zero on benralizumab; a transient rise on dupilumab</text>
  <text x="32" y="426" font-size="13">(label warning). EPOS: no biomarker yet predicts response in CRS. Emerging: IL-33, TSLP, periostin, 15-HETE, 15-oxo-ETE.</text>

  <text x="20" y="460" font-size="12" fill="#444">Schematic. CTA 2026, EPOS 2020 (as in 8.5). The FeNO mechanism (IL-13 induces epithelial iNOS) is standard physiology added for context.</text>
</svg>
