<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>Lund–Mackay CT score (schematic)</title>
  <defs>
    <clipPath id="half"><rect x="0" y="0" width="100" height="100"/></clipPath>
  </defs>
  <rect width="840" height="430" fill="#ffffff"/>

  <text x="20" y="30" font-weight="bold">A · Score each side on CT</text>
  <text x="520" y="30" font-weight="bold">B · Read the total (0–24)</text>

  <!-- header -->
  <g font-size="13" text-anchor="middle" fill="#444">
    <text x="270" y="60">0 · clear</text>
    <text x="350" y="60">1 · partial</text>
    <text x="430" y="60">2 · total</text>
  </g>
  <g font-size="14">
    <text x="20" y="96">maxillary</text>
    <text x="20" y="136">anterior ethmoid</text>
    <text x="20" y="176">posterior ethmoid</text>
    <text x="20" y="216">sphenoid</text>
    <text x="20" y="256">frontal</text>
    <text x="20" y="306" font-weight="bold">ostiomeatal complex</text>
  </g>

  <!-- icon rows: sinus = rounded box with air (white) and mucosa/fluid (grey) -->
  <g stroke="#1d1d1b" stroke-width="1.4">
    <!-- generic row template repeated at y = 78,118,158,198,238 -->
    <rect x="252" y="78" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="332" y="78" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="412" y="78" width="36" height="26" rx="6" fill="#8a8a85"/>
    <rect x="252" y="118" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="332" y="118" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="412" y="118" width="36" height="26" rx="6" fill="#8a8a85"/>
    <rect x="252" y="158" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="332" y="158" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="412" y="158" width="36" height="26" rx="6" fill="#8a8a85"/>
    <rect x="252" y="198" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="332" y="198" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="412" y="198" width="36" height="26" rx="6" fill="#8a8a85"/>
    <rect x="252" y="238" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="332" y="238" width="36" height="26" rx="6" fill="#ffffff"/>
    <rect x="412" y="238" width="36" height="26" rx="6" fill="#8a8a85"/>
  </g>
  <g fill="none" stroke="#8a8a85" stroke-width="5">
    <rect x="335" y="81" width="30" height="20" rx="4"/>
    <rect x="335" y="121" width="30" height="20" rx="4"/>
    <rect x="335" y="161" width="30" height="20" rx="4"/>
    <rect x="335" y="201" width="30" height="20" rx="4"/>
    <rect x="335" y="241" width="30" height="20" rx="4"/>
  </g>

  <!-- OMC row: binary -->
  <line x1="20" y1="278" x2="470" y2="278" stroke="#cfcdc7"/>
  <g font-size="12.5" text-anchor="middle">
    <text x="270" y="300">patent</text>
    <text x="270" y="316" font-weight="bold">0</text>
    <text x="350" y="300" fill="#b23a2e" font-weight="bold">no 1</text>
    <text x="350" y="316" fill="#444">(binary)</text>
    <text x="430" y="300">obstructed</text>
    <text x="430" y="316" font-weight="bold">2</text>
  </g>
  <rect x="20" y="334" width="450" height="36" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.1"/>
  <text x="32" y="357" font-size="14">5 sinuses × 2 + OMC 2 = <tspan font-weight="bold">12 per side</tspan>, <tspan font-weight="bold">24 total</tspan></text>

  <!-- B: scale -->
  <!-- scale 0..24 from x 520 to x 820: 12.5 px per point -->
  <rect x="520" y="80" width="37.5" height="40" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.4"/>
  <rect x="557.5" y="80" width="25" height="40" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1"/>
  <rect x="582.5" y="80" width="237.5" height="40" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.4"/>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="520" y="138">0</text><text x="551" y="138">2</text><text x="582" y="138">5</text>
    <text x="645" y="138">10</text><text x="707" y="138">15</text><text x="770" y="138">20</text><text x="820" y="138">24</text>
  </g>
  <text x="530" y="168" font-size="13.5" font-weight="bold" fill="#2f5d8a">≤2</text>
  <text x="560" y="168" font-size="13">excellent negative predictive</text>
  <text x="560" y="184" font-size="13">value: CRS unlikely</text>
  <text x="530" y="216" font-size="13.5" font-weight="bold" fill="#b23a2e">≥5</text>
  <text x="560" y="216" font-size="13">excellent positive predictive</text>
  <text x="560" y="232" font-size="13">value: CRS likely</text>
  <text x="530" y="264" font-size="13.5" font-weight="bold" fill="#444">3–4</text>
  <text x="560" y="264" font-size="13">between the two cut-offs</text>

  <rect x="520" y="290" width="300" height="80" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.1"/>
  <text x="532" y="310" font-size="13" font-weight="bold">Worked example</text>
  <text x="532" y="328" font-size="12.5">R: 2 + 1 + 1 + 0 + 1, OMC 2 = 7</text>
  <text x="532" y="344" font-size="12.5">L: 1 + 0 + 0 + 0 + 0, OMC 0 = 1</text>
  <text x="532" y="362" font-size="12.5">total <tspan font-weight="bold">8</tspan>: above the ≥5 cut-off</text>

  <text x="20" y="410" font-size="12" fill="#444">Schematic. EPOS / ICAR as summarized in the guide (3.5). The OMC is scored 0 or 2 only; a sinus is 0, 1 or 2.</text>
</svg>
