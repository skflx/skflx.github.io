<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>Allergen immunotherapy over a course: what changes and when (schematic)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/></marker>
  </defs>
  <rect width="860" height="520" fill="#ffffff"/>

  <text x="20" y="30" font-weight="bold">Immunotherapy retrains the response: blocking IgG4 and regulatory cells rise, symptoms fall and stay down</text>

  <!-- phase bar: year y -> x = 100 + 80 y -->
  <rect x="100" y="50" width="40" height="26" fill="#f7efe4" stroke="#1d1d1b" stroke-width="1"/>
  <rect x="140" y="50" width="280" height="26" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1"/>
  <rect x="420" y="50" width="340" height="26" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1"/>
  <text x="120" y="68" text-anchor="middle" font-size="11.5">build</text>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" font-weight="bold">maintenance: 3–5 years</text>
  <text x="590" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d8a">stopped: benefit persists</text>

  <!-- axes -->
  <line x1="100" y1="340" x2="790" y2="340" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="100" y1="340" x2="100" y2="92" stroke="#1d1d1b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="84" y="216" font-size="13" fill="#444" text-anchor="middle" transform="rotate(-90 84 216)">relative level</text>
  <g font-size="12.5" fill="#444" text-anchor="middle">
    <text x="100" y="358">0</text><text x="180" y="358">1</text><text x="260" y="358">2</text><text x="340" y="358">3</text>
    <text x="420" y="358">4</text><text x="500" y="358">5</text><text x="580" y="358">6</text><text x="660" y="358">7</text><text x="740" y="358">8</text>
  </g>
  <text x="440" y="378" font-size="12.5" fill="#444" text-anchor="middle">years from the first dose</text>
  <line x1="420" y1="84" x2="420" y2="340" stroke="#1d1d1b" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- curves -->
  <!-- sIgE: transient rise then fall -->
  <path d="M100,220 C118,200 132,176 150,178 C200,184 300,240 420,262 C520,272 640,268 760,264" stroke="#1d1d1b" stroke-width="2.4" fill="none" stroke-dasharray="7 4"/>
  <!-- IgG4 -->
  <path d="M100,330 C140,320 180,200 260,140 C320,120 400,118 420,118 C470,122 560,180 760,212" stroke="#2f5d8a" stroke-width="3" fill="none"/>
  <!-- Tregs / IL-10 -->
  <path d="M100,320 C130,300 170,220 230,196 C300,180 400,178 420,180 C500,190 620,210 760,222" stroke="#2f5d8a" stroke-width="2" fill="none" stroke-dasharray="3 4"/>
  <!-- symptom + medication -->
  <path d="M100,112 C130,112 150,120 170,160 C200,230 240,290 300,300 C360,306 400,306 420,306 C520,306 640,300 760,296" stroke="#b23a2e" stroke-width="3.6" fill="none"/>

  <!-- labels -->
  <text x="130" y="108" font-size="13" font-weight="bold" fill="#b23a2e">symptoms + medication: fall once on maintenance</text>
  <text x="440" y="288" font-size="12" fill="#b23a2e" font-weight="bold">stays low after stopping (SLIT: ≥2 y after a 3-year course)</text>
  <text x="580" y="104" font-size="13" font-weight="bold" fill="#2f5d8a">allergen-specific IgG4</text>
  <text x="580" y="120" font-size="12" fill="#444">"blocking" antibody: intercepts allergen</text>
  <text x="560" y="236" font-size="13" font-weight="bold" fill="#2f5d8a">Tregs, Bregs: IL-10, TGF-β</text>
  <text x="560" y="252" font-size="12" fill="#444">Th2 and ILC2 suppressed; IL-10⁺ ILCs rise</text>
  <text x="300" y="212" font-size="13" font-weight="bold">specific IgE</text>
  <text x="300" y="227" font-size="12" fill="#444">rises briefly, then falls</text>

  <!-- notes -->
  <rect x="20" y="394" width="400" height="104" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.1"/>
  <g font-size="12.5">
    <text x="32" y="414"><tspan font-weight="bold">Days–weeks:</tspan> mast cells and basophils desensitize</text>
    <text x="32" y="432"><tspan font-weight="bold">SCIT vs SLIT:</tspan> SCIT acts earlier, bigger IgG4 rise</text>
    <text x="32" y="450"><tspan font-weight="bold">Tissue:</tspan> fewer mast cells and eosinophils;</text>
    <text x="32" y="468">skin-test reactivity falls</text>
    <text x="32" y="488"><tspan font-weight="bold">Who:</tspan> testing matches exposure and symptoms; age ≥5</text>
  </g>
  <rect x="440" y="394" width="400" height="104" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.2"/>
  <text x="452" y="416" font-size="13" font-weight="bold" fill="#b23a2e">The curve assumes the patient stays on it</text>
  <g font-size="12.5">
    <text x="452" y="436">One pharmacy database: 18% reached 3 years</text>
    <text x="452" y="454">(SCIT 23%, SLIT 7%). German data: SCIT 35–37%,</text>
    <text x="452" y="472">SLIT 10–18%. Most adherence data are</text>
    <text x="452" y="490">retrospective.</text>
  </g>

  <text x="20" y="514" font-size="12" fill="#444">Schematic: directions from ICAR XI; curve heights and timing illustrative, not data.</text>
</svg>
