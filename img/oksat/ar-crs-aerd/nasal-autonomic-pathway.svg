<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1d1d1b">
  <title>Autonomic supply of the nose and where each treatment acts (schematic)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/></marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>

  <text x="20" y="30" font-weight="bold">A · The secretomotor route: why vidian neurectomy dries the eye and a posterior nasal nerve ablation should not</text>

  <!-- parasympathetic row -->
  <text x="20" y="62" font-size="12.5" fill="#2f5d8a" font-weight="bold">parasympathetic (preganglionic)</text>
  <g fill="#ffffff" stroke="#2f5d8a" stroke-width="1.5">
    <rect x="20" y="72" width="150" height="52" rx="4"/>
    <rect x="200" y="72" width="150" height="52" rx="4"/>
    <rect x="380" y="72" width="150" height="52" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="95" y="94" font-weight="bold">superior salivatory</text><text x="95" y="112">nucleus (pons)</text>
    <text x="275" y="94" font-weight="bold">nervus intermedius</text><text x="275" y="112">(with CN VII)</text>
    <text x="455" y="94" font-weight="bold">greater superficial</text><text x="455" y="112">petrosal nerve</text>
  </g>
  <g stroke="#2f5d8a" stroke-width="1.8" fill="none">
    <path d="M170,98 L196,98" marker-end="url(#arr)"/>
    <path d="M350,98 L376,98" marker-end="url(#arr)"/>
    <path d="M530,98 C560,98 560,140 580,148" marker-end="url(#arr)"/>
  </g>

  <!-- sympathetic row -->
  <text x="20" y="200" font-size="12.5" font-weight="bold" fill="#444">sympathetic (postganglionic)</text>
  <g fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3" stroke-dasharray="5 3">
    <rect x="20" y="210" width="150" height="52" rx="4"/>
    <rect x="200" y="210" width="150" height="52" rx="4"/>
    <rect x="380" y="210" width="150" height="52" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="95" y="232" font-weight="bold">superior cervical</text><text x="95" y="250">ganglion</text>
    <text x="275" y="232" font-weight="bold">internal carotid</text><text x="275" y="250">plexus</text>
    <text x="455" y="232" font-weight="bold">deep petrosal</text><text x="455" y="250">nerve</text>
  </g>
  <g stroke="#1d1d1b" stroke-width="1.4" fill="none" stroke-dasharray="5 3">
    <path d="M170,236 L196,236" marker-end="url(#arr)"/>
    <path d="M350,236 L376,236" marker-end="url(#arr)"/>
    <path d="M530,236 C560,236 560,190 580,180" marker-end="url(#arr)"/>
  </g>

  <!-- vidian -->
  <rect x="584" y="138" width="110" height="56" rx="4" fill="#f2f2ef" stroke="#1d1d1b" stroke-width="1.5"/>
  <text x="639" y="160" text-anchor="middle" font-weight="bold" font-size="14">vidian nerve</text>
  <text x="639" y="178" text-anchor="middle" font-size="12">(pterygoid canal)</text>
  <path d="M694,166 L716,166" stroke="#1d1d1b" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- PPG -->
  <rect x="720" y="134" width="164" height="64" rx="4" fill="#e7edf3" stroke="#2f5d8a" stroke-width="1.6"/>
  <text x="802" y="156" text-anchor="middle" font-weight="bold" font-size="14">pterygopalatine</text>
  <text x="802" y="173" text-anchor="middle" font-weight="bold" font-size="14">ganglion</text>
  <text x="802" y="190" text-anchor="middle" font-size="12">parasympathetics synapse</text>

  <!-- outputs -->
  <rect x="740" y="54" width="144" height="44" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="812" y="73" text-anchor="middle" font-size="13.5" font-weight="bold">lacrimal gland</text>
  <text x="812" y="90" text-anchor="middle" font-size="12">tears</text>
  <path d="M802,134 L802,102" stroke="#1d1d1b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <rect x="720" y="258" width="164" height="60" rx="4" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="802" y="278" text-anchor="middle" font-size="13.5" font-weight="bold">posterior nasal</text>
  <text x="802" y="295" text-anchor="middle" font-size="13.5" font-weight="bold">nerves</text>
  <text x="802" y="311" text-anchor="middle" font-size="12">→ glands, vessels</text>
  <path d="M802,198 L802,254" stroke="#1d1d1b" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- cut marks -->
  <g stroke="#b23a2e" stroke-width="3.2" stroke-linecap="round">
    <path d="M698,152 L712,180"/>
    <path d="M790,218 L814,236"/>
  </g>
  <rect x="560" y="276" width="146" height="68" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.2"/>
  <text x="570" y="296" font-size="13" font-weight="bold" fill="#b23a2e">vidian neurectomy</text>
  <text x="570" y="314" font-size="12.5">rhinorrhea ↓</text>
  <text x="570" y="332" font-size="12.5" font-weight="bold">+ dry eye</text>
  <path d="M650,274 L703,184" stroke="#b23a2e" stroke-width="1.2" fill="none"/>
  <rect x="720" y="330" width="164" height="68" fill="#f6e4e1" stroke="#b23a2e" stroke-width="1.2"/>
  <text x="730" y="350" font-size="13" font-weight="bold" fill="#b23a2e">PNN cryo / RF /</text>
  <text x="730" y="366" font-size="13" font-weight="bold" fill="#b23a2e">neurectomy</text>
  <text x="730" y="386" font-size="12.5">rhinorrhea ↓, tears spared</text>
  <text x="20" y="300" font-size="12.5" fill="#444">The sympathetic fibres pass through the ganglion without synapsing.</text>
  <text x="20" y="318" font-size="12.5" fill="#444">Both cuts remove secretomotor (parasympathetic) supply to the nasal glands;</text>
  <text x="20" y="336" font-size="12.5" fill="#444">only the vidian cut is upstream of the lacrimal branch.</text>

  <!-- B: end organ -->
  <line x1="20" y1="416" x2="880" y2="416" stroke="#cfcdc7" stroke-width="1.2"/>
  <text x="20" y="444" font-weight="bold">B · At the mucosa: what each nerve does, and what blocks it</text>

  <rect x="20" y="458" width="270" height="146" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/>
  <text x="32" y="480" font-weight="bold" font-size="14">Glands</text>
  <text x="32" y="500" font-size="12.5">parasympathetic ACh (muscarinic)</text>
  <text x="32" y="516" font-size="12.5">+ VIP → watery secretion</text>
  <text x="32" y="546" font-size="12.5" font-weight="bold" fill="#b23a2e">ipratropium</text>
  <text x="32" y="562" font-size="12.5">blocks muscarinic receptors:</text>
  <text x="32" y="578" font-size="12.5">rhinorrhea only, not congestion</text>
  <text x="32" y="594" font-size="12.5">or sneeze</text>

  <rect x="305" y="458" width="270" height="146" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/>
  <text x="317" y="480" font-weight="bold" font-size="14">Venous sinusoids</text>
  <text x="317" y="500" font-size="12.5"><tspan font-weight="bold">constrict</tspan>: sympathetic NE + NPY</text>
  <text x="317" y="516" font-size="12.5">(α1, α2) → decongestion</text>
  <text x="317" y="536" font-size="12.5"><tspan font-weight="bold">dilate</tspan>: VIP, CGRP (long-acting,</text>
  <text x="317" y="552" font-size="12.5">↑ in AR), substance P → congestion</text>
  <text x="317" y="578" font-size="12.5" font-weight="bold" fill="#b23a2e">α-agonist decongestants</text>
  <text x="317" y="594" font-size="12.5">mimic NE; rebound with prolonged use</text>

  <rect x="590" y="458" width="290" height="146" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.2"/>
  <text x="602" y="480" font-weight="bold" font-size="14">Sensory (trigeminal) C and Aδ fibres</text>
  <text x="602" y="500" font-size="12.5">TRPV1, TRPA1 sense histamine, bradykinin,</text>
  <text x="602" y="516" font-size="12.5">capsaicin → itch, sneeze; release SP, CGRP,</text>
  <text x="602" y="532" font-size="12.5">NKA. NGF from mast cells adds fibres.</text>
  <text x="602" y="562" font-size="12.5"><tspan font-weight="bold" fill="#b23a2e">azelastine</tspan> downregulates TRP channels</text>
  <text x="602" y="578" font-size="12.5"><tspan font-weight="bold" fill="#b23a2e">intranasal capsaicin</tspan> desensitizes TRPV1</text>
  <text x="602" y="594" font-size="12.5">(non-allergic and mixed rhinitis)</text>

  <text x="20" y="628" font-size="12" fill="#444">Schematic. ICAR VI (neural mechanisms), ICAR V.B.2. Parasympathetic overactivity is the classic model of non-allergic (vasomotor) rhinitis.</text>
</svg>
