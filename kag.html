<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Atlas Graph | skflx.MD</title>
    <meta name="description" content="The Knowledge Atlas Graph is now the Knowledge lens of the unified graph page.">
    <!-- The KAG is now the Knowledge lens of the unified graph (graph.html).
         This stub redirects and FORWARDS any ?node=<id> deep link so every
         existing kag.html?node= bookmark keeps landing on the right node. -->
    <script>
        (function () {
            try {
                var node = new URLSearchParams(location.search).get('node');
                location.replace('graph.html?lens=knowledge' + (node ? '&node=' + encodeURIComponent(node) : ''));
            } catch (e) {
                location.replace('graph.html?lens=knowledge');
            }
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=graph.html?lens=knowledge">
    <style>
        body { font-family: system-ui, sans-serif; background: #08090B; color: #8D99A6; display: flex; height: 100vh; margin: 0; align-items: center; justify-content: center; }
        a { color: #4FB3E8; }
    </style>
</head>

<body>
    <p>Redirecting to the <a href="graph.html?lens=knowledge">unified graph — Knowledge lens</a>…</p>
</body>

</html>
