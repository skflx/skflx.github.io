name: CI

# Verification only — this repo has NO build step. GitHub Pages serves the
# repo root as-is; CI never produces artifacts the site depends on.
on:
  pull_request:
  push:
    branches: [master]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The change detector below diffs against the PR's base branch.
          fetch-depth: 0

      # Run the slow suites only when something they exercise changed.
      # check-data (every invariant) and the page smoke test always run, so
      # a cross-cutting regression still fails. A push to master runs
      # everything.
      - name: Detect what changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            changed="ALL"
          fi
          echo "Changed files:"; echo "$changed"
          shared='css/site\.css|js/site\.js|js/theme-boot\.js|tools/smoke-lib\.mjs|package(-lock)?\.json'
          match() { [ "$changed" = "ALL" ] || echo "$changed" | grep -Eq "^($1|$shared)"; echo $?; }
          flag() { if [ "$(match "$2")" = "0" ]; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          flag ssb   'js/ssb/|ssb/|ssb\.html|css/ssb\.css|js/vendor/three|tools/(test-ssb|ssb-)'
          flag oksat 'js/oksat-|js/mcq-modules/pediatrics|js/vendor/(react|htm)|css/oksat\.css|oksat(-study)?\.html|tools/test-oksat-engine'
          flag wiki  'wiki/|tools/test-wiki-sync'
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Data invariants have zero deps — run first so a data regression
      # fails in seconds, before we install anything.
      - name: Check committed data
        run: node tools/check-data.mjs

      # The wiki sync is the privacy boundary for the Obsidian vault;
      # zero deps, synthetic fixtures only.
      - name: Wiki sync behavior tests
        if: steps.changes.outputs.wiki == 'true'
        run: node tools/test-wiki-sync.mjs

      - name: Install dev dependencies
        run: npm ci

      # Playwright's own Chromium + OS libs. Page scripts are all
      # same-origin (React/htm are vendored in js/vendor/), so the suites
      # are hermetic apart from optional Google Fonts on OKSAT pages.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test every page
        run: node tools/smoke-pages.mjs

      # SSB variant lab: dioramas, computed pathway rules, picking, hash.
      - name: SSB behavior tests
        if: steps.changes.outputs.ssb == 'true'
        run: node tools/test-ssb.mjs

      - name: OKSAT engine behavior tests
        if: steps.changes.outputs.oksat == 'true'
        run: node tools/test-oksat-engine.mjs
